plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.116'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        url = 'https://cursemaven.com'
    }
    maven {
        url = 'https://maven.opnsoc.org/releases'
    }
    mavenCentral()
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(
                org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        )
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are normally detected automatically.
    // accessTransformers.add(
    //         'src/main/resources/META-INF/accesstransformer.cfg'
    // )

    runs {
        client {
            client()

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        server {
            server()

            programArgument '--nogui'

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        gameTestServer {
            type = 'gameTestServer'

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        data {
            data()

            programArguments.addAll(
                    '--mod',
                    project.mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/').absolutePath,
                    '--existing',
                    file('src/main/resources/').absolutePath
            )
        }

        configureEach {
            systemProperty(
                    'forge.logging.markers',
                    'REGISTRIES'
            )

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by the data generator.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    implementation(
            'curse.maven:open-parties-and-claims-636608:8507166'
    )
    implementation(
            'curse.maven:xaeros-minimap-263420:8449819'
    )
    implementation(
            'curse.maven:xaeros-world-map-317780:8449921'
    )

    implementation(jarJar('net.swzo.brass:brassui:2.2.11'))
    runtimeOnly 'thedarkcolour:kotlinforforge-neoforge:5.12.0'
}

/*
 * Expands the declared mod properties into the files located under
 * src/main/templates.
 */
def generateModMetadata = tasks.register(
        'generateModMetadata',
        ProcessResources
) {
    def replaceProperties = [
            minecraft_version:
                    minecraft_version,
            minecraft_version_range:
                    minecraft_version_range,
            neo_version:
                    neo_version,
            neo_version_range:
                    neo_version_range,
            loader_version_range:
                    loader_version_range,
            mod_id:
                    mod_id,
            mod_name:
                    mod_name,
            mod_license:
                    mod_license,
            mod_version:
                    mod_version,
            mod_authors:
                    mod_authors,
            mod_description:
                    mod_description
    ]

    inputs.properties replaceProperties

    expand replaceProperties

    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

// Include generated mod metadata in the main resources.
sourceSets.main.resources.srcDir generateModMetadata

// Generate metadata during IDE synchronization.
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
